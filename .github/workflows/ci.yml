name: ci

# 之前只有手动触发的 windows-build，main 上的提交与 PR 都不跑测试，
# 合并前只能靠本地 `npm test` 自觉。这里补上 push / PR 的必跑项。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 曾经用过 concurrency(cancel-in-progress)；2026-10-27 遇到一次 GitHub 侧状态不一致：
# run 的 jobs 全绿、artifact 已上传，但 run 级 status 永久停在 in_progress，
# 于是占住了同一 ref 的并发组，后续 workflow_dispatch 一直排队，且 cancel / force-cancel 都返回
# "not in progress"。去掉并发组，宁可偶尔并行跑两次，也不要整条 CI 被一个幽灵 run 卡死。

jobs:
  unit:
    name: tsc + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    # 故意不设 TZ：runner 是 UTC，刚好能抓住「按本机时区渲染却按 +08 断言」的测试
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 单元测试（含 kb.json 新鲜度与工具数量文档一致性）
        run: npm test
      - name: 数据包校验
        run: npm run packs:validate
      # FeatureTree 契约服务（自起服务、FT_PORT=0，跑完自动关）
      - name: 契约服务验收（featuretree-service）
        timeout-minutes: 5
        run: node ../featuretree-service/tests.mjs   # unit job 的 cwd 是 desktop
      - name: MCP ↔ 契约服务双向验收
        timeout-minutes: 5
        run: node ../featuretree-service/mcp-tests.mjs
      - name: 多文档验收（文档隔离 / 列表 / 409 / 404）
        timeout-minutes: 5
        run: node ../featuretree-service/multidoc-tests.mjs
      - name: Store 单元验收（不经 HTTP）
        timeout-minutes: 5
        run: node ../featuretree-service/store-tests.mjs
      - name: 落盘/恢复验收（FT_DATA_DIR）
        timeout-minutes: 5
        run: node ../featuretree-service/persistence-tests.mjs
      # 离线规则评估与能力报告此前没人跑，工具加了却不进评估集也发现不了（本轮就是 eval:agent 红的）
      - name: 离线规则评估（含工具覆盖校验）
        run: npm run eval:agent
      - name: Agent 能力报告（防止脚本本身崩）
        run: npm run agent:report

  qt-client:
    name: Qt client build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Qt6 开发包
        run: |
          sudo apt-get update
          # OpenGLWidgets 在 libqt6opengl6-dev；libgl1-mesa-dri 提供 llvmpipe 软件 GL
          sudo apt-get install -y --no-install-recommends qt6-base-dev libqt6opengl6-dev libgl1-mesa-dri libglx-mesa0 cmake g++
      - name: 配置与编译
        run: |
          cmake -S qt-client -B build-qt -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qt -j4
      - name: 可执行文件存在
        run: test -x build-qt/automationcad-qt
      # 方案窗口的「合规戳 / 排布明细」读的是方案文件本身，不需要 node：
      # 直接用提交在仓库里的 fixture 验，防「JSON 里有、界面读不出来」这类回归。
      - name: 方案窗口冒烟（合规戳 / 排布 CSV）
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE"
          export QT_QPA_PLATFORM=offscreen
          ./build-qt/automationcad-qt --qt-smoke docs/desktop/eval/layout-case.json 2>&1 | tee /tmp/qt-smoke.log
          # qInfo 用 << 拼接会在 = 两侧插空格，所以按宽松匹配断言
          grep -qE "QT_SMOKE_OK[[:space:]]+checks=[[:space:]]*2" /tmp/qt-smoke.log
          # 方案存盘往返（不依赖 node）：存到临时文件再回读比对
          ./build-qt/automationcad-qt --case-save-selftest docs/desktop/eval/layout-case.json 2>&1 | tee /tmp/qt-roundtrip.log
          grep -qE "FT_QT_CASE_RT_OK" /tmp/qt-roundtrip.log
          # 构件库失败态：必须给出原因 + 可复制命令 + 重试，不能是空列表
          ./build-qt/automationcad-qt --catalog-hint-selftest 2>&1 | tee /tmp/qt-catalog-hint.log
          grep -qE "FT_QT_CATALOG_HINT_OK" /tmp/qt-catalog-hint.log
          # 换一种失败：node 不可用时提示必须指向 node，而不是让人去设管线路径
          ./build-qt/automationcad-qt --catalog-hint-selftest node 2>&1 | tee /tmp/qt-catalog-hint-node.log
          grep -qE "FT_QT_CATALOG_HINT_OK" /tmp/qt-catalog-hint-node.log
          # 第三种：脚本能跑但非零退出，必须带出 exit code 与 stderr
          ./build-qt/automationcad-qt --catalog-hint-selftest crash 2>&1 | tee /tmp/qt-catalog-hint-crash.log
          grep -qE "FT_QT_CATALOG_HINT_OK" /tmp/qt-catalog-hint-crash.log
      # 整机交互自检：这些不依赖 OCCT，但此前从没进过 CI——
      # 构件库插入、最大间距、排布、间距阈值、整站挪、过期戳、复核跳过，
      # 都是最近改过的功能，靠人手跑等于没有守卫。
      - name: 整机交互自检（headless，无 OCCT）
        timeout-minutes: 10
        run: |
          cd "$GITHUB_WORKSPACE"
          export QT_QPA_PLATFORM=offscreen
          BRIEF="四工位点胶机，节拍 25 件/分钟"
          run() {
            name="$1"; shift
            ./build-qt/automationcad-qt "$@" > "/tmp/qt-$name.log" 2>&1 || { echo "FAIL $name"; cat "/tmp/qt-$name.log"; return 1; }
            echo "OK $name"
          }
          run insert --insert-selftest "$BRIEF" upright
          grep -qE "FT_QT_INSERT_OK" /tmp/qt-insert.log
          run max-clearance --max-clearance-selftest "$BRIEF"
          grep -qE "FT_QT_MAXCLEARANCE_OK feasible=25" /tmp/qt-max-clearance.log
          run layout --layout-selftest docs/desktop/eval/layout-case.json
          grep -qE "FT_QT_LAYOUT_OK" /tmp/qt-layout.log
          run threshold --threshold-selftest "$BRIEF"
          grep -qE "FT_QT_THRESHOLD_OK" /tmp/qt-threshold.log
          run station-move --station-move-selftest "$BRIEF"
          grep -qE "FT_QT_STATION_OK" /tmp/qt-station-move.log
          run stale-stamp --stale-stamp-selftest docs/desktop/eval/layout-case.json
          grep -qE "FT_QT_STALE_OK" /tmp/qt-stale-stamp.log
          run recheck-skip --recheck-skip-selftest docs/desktop/eval/machine-case.json
          grep -qE "FT_QT_RECHECK_SKIP_OK" /tmp/qt-recheck-skip.log
          # 贴面文案：用 brief 现场跑管线，别拿旧的 fixture（它没有 touching 字段）
          run touching-label --touching-label-selftest "六工位锁螺丝机，节拍 20 件/分钟，每工位 1 套汇川 750W 伺服 + 1 个 SMC 气爪 + 1 个到位检测 + 安全光栅"
          grep -qE "FT_QT_TOUCHING_OK" /tmp/qt-touching-label.log
          # 建议位移 / 过期重算 / 工位级建议范围：都是改过排布逻辑后最该盯的
          run apply-hint --apply-hint-selftest "$BRIEF"
          grep -qE "FT_QT_APPLY_HINT_OK" /tmp/qt-apply-hint.log
          run recompute --recompute-selftest "$BRIEF"
          grep -qE "FT_QT_RECOMPUTE_OK" /tmp/qt-recompute.log
          run shift-scope --shift-scope-selftest "$BRIEF"
          grep -qE "FT_QT_SHIFT_OK" /tmp/qt-shift-scope.log
          # 两种 CSV 导出：行数必须与零件数 / BOM 行数一致
          run layout-csv --layout-csv-selftest docs/desktop/eval/layout-case.json --out /tmp/layout.csv
          grep -qE "FT_QT_LAYOUTCSV_OK rows=50" /tmp/qt-layout-csv.log
          run machine-bom --machine-bom-selftest docs/desktop/eval/machine-case.json --out /tmp/machine-bom.csv
          grep -qE "FT_QT_MACHINEBOM_OK rows=12" /tmp/qt-machine-bom.log
      - name: Qt 客户端 ↔ 契约服务自检
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE"
          FT_PORT=18080 node featuretree-service/server.mjs > /tmp/ft-service.log 2>&1 &
          SERVICE_PID=$!
          for i in $(seq 1 50); do
            grep -q "服务已启动" /tmp/ft-service.log && break
            sleep 0.2
          done
          QT_QPA_PLATFORM=offscreen ./build-qt/automationcad-qt --selftest --base http://127.0.0.1:18080
          STATUS=$?
          QT_QPA_PLATFORM=offscreen ./build-qt/automationcad-qt --history-selftest --base http://127.0.0.1:18080 || STATUS=1
          kill $SERVICE_PID || true
          cat /tmp/ft-service.log
          exit $STATUS
      - name: 装 build123d（特征操作自检要真几何）
        timeout-minutes: 12
        run: |
          python3 -m venv .venv-ft
          . .venv-ft/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet build123d==0.13.0
      - name: 压缩 / 删除引用 / 解除压缩（真几何）
        timeout-minutes: 8
        run: |
          cd "$GITHUB_WORKSPACE"
          . .venv-ft/bin/activate
          FT_BUILD_PORT=18081 python featuretree-service/rebuild-sidecar.py > /tmp/sidecar.log 2>&1 &
          SIDECAR_PID=$!
          # 先等 sidecar 真的起来（build123d 首次 import 要几秒），再起契约服务，避免 init 撞空
          for i in $(seq 1 120); do
            grep -q "rebuild sidecar listening" /tmp/sidecar.log && break
            sleep 0.5
          done
          FT_PORT=18082 FT_BUILD_URL=http://127.0.0.1:18081 node featuretree-service/server.mjs > /tmp/ft-service2.log 2>&1 &
          SERVICE_PID=$!
          for i in $(seq 1 80); do
            grep -q "服务已启动" /tmp/ft-service2.log && break
            sleep 0.3
          done
          QT_QPA_PLATFORM=offscreen ./build-qt/automationcad-qt --feature-ops-selftest --base http://127.0.0.1:18082
          STATUS=$?
          QT_QPA_PLATFORM=offscreen ./build-qt/automationcad-qt --create-feature-selftest --base http://127.0.0.1:18082 || STATUS=1
          kill $SERVICE_PID $SIDECAR_PID || true
          cat /tmp/sidecar.log /tmp/ft-service2.log
          exit $STATUS
      - name: Qt 自动刷新验收（外部改树 → 客户端 1.5s 内刷新）
        timeout-minutes: 5
        run: node qt-client/tests/watch.mjs --binary build-qt/automationcad-qt
      - name: 一句话 → 整机方案（Qt 调 desktop 管线）
        timeout-minutes: 6
        run: |
          cd "$GITHUB_WORKSPACE"
          QT_QPA_PLATFORM=offscreen AUTOMATIONCAD_PIPELINE="$GITHUB_WORKSPACE/desktop/scripts/machine-design-cli.mjs" \
            ./build-qt/automationcad-qt --brief-selftest "四工位点胶机，节拍 25 件/分钟，每工位 1 套步进 + 1 个气爪 + 1 个到位检测"
      - name: Qt SSE 推送验收（轮询设 30s，只能靠事件）
        timeout-minutes: 5
        run: node qt-client/tests/sse.mjs --binary build-qt/automationcad-qt

  # 之前的 Qt job 从不编译 OCCT 分支（OcctViewport/剖切/STL/AIS 全在 #ifdef 里），
  # 等于「CI 绿、但这部分代码没编译过」。这个 job 专治它。
  qt-occt:
    name: Qt + OCCT 视口
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Qt6 + OCCT 开发包 + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6opengl6-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-visualization-dev libocct-data-exchange-dev libocct-ocaf-dev \
            libgl1-mesa-dri libglx-mesa0 xvfb cmake g++
      - name: 配置与编译（OCCT=ON）
        run: |
          cmake -S qt-client -B build-occt -DCMAKE_BUILD_TYPE=Release -DAUTOMATIONCAD_OCCT=ON 2>&1 | tee /tmp/cmake-occt.log
          # 找不到头文件时 CMake 会静默回退到无 OCCT —— 那这个 job 就白跑了，必须显式断言
          grep -q "OCCT AIS 视口：启用" /tmp/cmake-occt.log || { echo "OCCT 没启用，检查 apt 包名"; exit 1; }
          cmake --build build-occt -j4
      - name: OCCT 视口自检（xvfb）
        timeout-minutes: 15
        run: |
          cd "$GITHUB_WORKSPACE"
          BRIEF="四工位点胶机，节拍 25 件/分钟"
          run() {
            name="$1"; shift
            xvfb-run -a -s "-screen 0 1400x900x24" ./build-occt/automationcad-qt "$@" > "/tmp/occt-$name.log" 2>&1 || { echo "FAIL $name"; cat "/tmp/occt-$name.log"; return 1; }
            echo "OK $name"
          }
          # 剖切：走 BRepAlgoAPI_Cut，判据看体积下降（曾用 ClipPlane 无效）
          run clip --clip-selftest "$BRIEF" 400
          grep -qE "FT_QT_CLIP_OK" /tmp/occt-clip.log
          # 整机 STL 导出：必须有真实字节数
          run geometry --geometry-selftest "$BRIEF" --out /tmp/machine.stl
          grep -qE "FT_QT_GEOMETRY_OK" /tmp/occt-geometry.log
          test "$(stat -c %s /tmp/machine.stl)" -gt 100000
          run move-part --move-part-selftest "$BRIEF" frame-leg-1 70 30
          grep -qE "FT_QT_MOVE" /tmp/occt-move-part.log
          run undo-insert --undo-insert-selftest "$BRIEF" upright
          grep -qE "FT_QT_UNDO_INSERT_OK" /tmp/occt-undo-insert.log
          run size-undo --size-undo-selftest "$BRIEF" upright 60x60x1200
          grep -qE "FT_QT_SIZE_UNDO_OK" /tmp/occt-size-undo.log
          run undo-stack --undo-stack-selftest "$BRIEF" frame-leg-1
          grep -qE "FT_QT_UNDO_STACK_OK" /tmp/occt-undo-stack.log
          run preview --preview-selftest "$BRIEF" upright
          grep -qE "FT_QT_PREVIEW_OK" /tmp/occt-preview.log
          run drop --drop-selftest "$BRIEF" gripper
          grep -qE "FT_QT_DROP_OK" /tmp/occt-drop.log
          run linkage --linkage-selftest "$BRIEF"
          grep -qE "FT_QT_LINKAGE_OK .*ioMissing=0" /tmp/occt-linkage.log
  # Windows 侧一直只有老王人工验证，仓库里没有任何 Windows 产物。
  # 这个 job 至少保证「Windows 上能编译」这件事不再靠人肉发现。
  qt-windows:
    name: Qt 客户端（Windows 编译）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Qt6（MSVC 2022 x64）
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
      # windows-latest 上 "Visual Studio 17 2022" 生成器不一定可用（实测报 could not find any instance），
      # 改成显式进入 MSVC 环境 + Ninja，不依赖具体 VS 版本号。
      - name: 进入 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 配置与编译（无 OCCT）
        run: |
          cmake -S qt-client -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUTOMATIONCAD_OCCT=OFF
          cmake --build build-win
      - name: 可执行文件与版本
        shell: pwsh
        run: |
          if (-not (Test-Path build-win/automationcad-qt.exe)) { throw "没产出 automationcad-qt.exe" }
          ./build-win/automationcad-qt.exe --version
  featuretree-geometry:
    name: FeatureTree real geometry (build123d)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 build123d
        run: |
          python -m venv .venv-ft
          . .venv-ft/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet build123d==0.13.0
      # 真实 OCCT 重建：种子树体积必须等于手算（94166.8 mm³），改板厚后按手算变化
      - name: 装配验收（并集 / 包围盒 / STL / 错误路径）
        timeout-minutes: 10
        run: |
          . .venv-ft/bin/activate
          FT_PYTHON="$PWD/.venv-ft/bin/python" node featuretree-service/assembly-tests.mjs
      - name: 体积/包围盒/质量 + 失败路径
        timeout-minutes: 10
        run: |
          . .venv-ft/bin/activate
          FT_PYTHON="$PWD/.venv-ft/bin/python" node featuretree-service/build-tests.mjs
      # AABB 初筛 vs 真实布尔：量出「把圆柱当方块」与「看不见孔」两种误差方向
      - name: AABB 初筛与真实布尔的误差
        timeout-minutes: 10
        run: |
          . .venv-ft/bin/activate
          FT_PYTHON="$PWD/.venv-ft/bin/python" node featuretree-service/aabb-vs-boolean.mjs

  smoke:
    name: Electron smoke (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装 Electron 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             xvfb libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2             libdrm2 libgtk-3-0 libasound2t64 libxss1 libxrandr2 libxkbcommon0
      - name: 安装依赖
        run: npm ci
      - name: 构建扩展（smoke 需要 dist/）
        run: npm run build:ext
      # smoke 覆盖画布/设计向导/机型/Agent 等的真实渲染路径，之前只在本机跑，CI 永远发现不了回归
      - name: 冒烟（xvfb + 真实 Electron，降级渲染）
        timeout-minutes: 12
        run: npm run smoke
      # 降级 smoke 关掉了 WebGL；这条用 SwiftShader 真跑 3D，覆盖占位盒尺寸等几何断言
      - name: WebGL 冒烟（SwiftShader）
        timeout-minutes: 12
        run: npm run smoke:design:webgl
      # 机型四张图曾经四张同图还「全绿」；脚本内的 sha256 去重会在这里把它拦住
      - name: 机型全流程截图（含去重校验）
        timeout-minutes: 10
        run: npm run screenshots:machine
      # 外部客户端契约（MCP/JSON-RPC）：401、tools/list、resources、-32602/-32601、只读调用
      - name: 外部客户端冒烟（MCP/JSON-RPC）
        timeout-minutes: 8
        run: npm run smoke:mcp
      - name: 上传机型截图
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: machine-screenshots
          path: |
            docs/desktop/screenshots/1[5-8]-machine-*.png
            docs/desktop/eval/machine-screenshots.json
          if-no-files-found: error
      - name: 失败时保留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            docs/desktop/eval/*.json
            desktop/*.log
          if-no-files-found: ignore


name: windows-build

on:
  # 仅手动触发：gh workflow run windows-build --ref main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build:ext

      - name: 单元测试
        run: npm test

      - name: 打包 NSIS 安装程序
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 列出产物
        run: Get-ChildItem release | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: AutomationCAD-Setup-win-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          draft: false
          generate_release_notes: false
